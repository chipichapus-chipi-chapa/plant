# Сайт на GitHub Pages: страница установки (site/) в корне и сама игра в app/.
# Адрес сервера берётся из переменной репозитория API_URL (Settings → Secrets and variables → Actions → Variables).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Сборка игры
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          # полный путь нужен сервис-воркеру и манифесту: игра лежит не в корне, а в /<репозиторий>/app/
          VITE_BASE: /${{ github.event.repository.name }}/app/
          VITE_API_URL: ${{ vars.API_URL }}
          # вне Telegram (приложение, браузер) игрок входит по ключу устройства
          VITE_DEVICE_LOGIN: 'true'
      - name: Сборка сайта
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r frontend/dist _site/app
          # адрес сервера для страницы установки (ссылка на бота)
          echo "window.GARDEN_API = '${{ vars.API_URL }}';" > _site/config.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
