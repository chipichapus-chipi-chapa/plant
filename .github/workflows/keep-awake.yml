# Бесплатный сервер Render засыпает после 15 минут без запросов, и первый вход
# ждёт его пробуждения около минуты. Лёгкий запрос раз в 10 минут не даёт ему уснуть.
# 750 бесплатных часов Render в месяц хватает на один сервер без перерыва.
name: Keep awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Разбудить сервер
        run: curl -fsS --max-time 120 --retry 2 "${{ vars.API_URL }}/actuator/health"
