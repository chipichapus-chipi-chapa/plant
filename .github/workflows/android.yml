# APK для Android: собирается из той же игры (Capacitor) и выкладывается в выпуск «android».
# Ссылка на скачивание всегда одна: releases/download/android/where-it-grows.apk
# На PR APK только собирается и проверяется (файл — в артефактах запуска), выпуск обновляется из main.
name: Android

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Сборка игры
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_DEVICE_LOGIN: 'true'
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Ключ подписи
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Сборка APK
        working-directory: frontend/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/where-it-grows.apk"
      - name: Проверка подписи
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs where-it-grows.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: where-it-grows-apk
          path: where-it-grows.apk
      - name: Выпуск «android»
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="«Там, где растёт» для Android, версия 1.0.${{ github.run_number }}. Скачайте where-it-grows.apk и установите поверх старой версии — сад сохранится."
          gh release view android >/dev/null 2>&1 || gh release create android --title "«Там, где растёт» для Android" --notes "$NOTES" --latest
          gh release upload android where-it-grows.apk --clobber
          gh release edit android --notes "$NOTES" --latest
